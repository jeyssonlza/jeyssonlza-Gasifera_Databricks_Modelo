# Declarative Automation Bundle configuration, more info here: https://docs.databricks.com/en/dev-tools/bundles/settings.html
bundle:
  name: "gasifera_pipeline_calidad_y_gold"

include:
  - resources/*.yml
  - resources/*/*.yml

targets:
  # The 'dev' target, for development purposes. This target is the default.
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-20c6316e-c3c7.cloud.databricks.com

  # The 'prod' target, used for production deployment.
  prod:
    mode: production
    workspace:
      host: https://dbc-20c6316e-c3c7.cloud.databricks.com
      # We always use the current user's folder for all resources to make sure we only have a single copy.
      root_path: /Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    # In production the bundle runs as the deploying identity. You could also use a service principal here,
    # see https://docs.databricks.com/dev-tools/bundles/permissions.html.
